			<h1> Lincoln Decision Explorer </h1>
			<p id="ExplorerSubtitle">April 1861: The Call for Troops</p>
		</div>
		<div class="col-10" id="MainSection">

			<div id="ViewToggle">
				<button class="view-btn active" data-view="timeline">Timeline</button>
				<button class="view-btn" data-view="documents">Documents</button>
			</div>

			<div id="ExplorerContent">
				<!-- Timeline-Decision View -->
				<div id="TimelineView"></div>

				<!-- Document Explorer View -->
				<div id="DocumentView">
					<div id="DocumentFilters">
						<input type="text" id="DocumentSearch" placeholder="Search documents...">
						<select id="DocumentTypeFilter">
							<option value="all">All Types</option>
							<option value="letter">Letters</option>
							<option value="telegram">Telegrams</option>
							<option value="order">Orders</option>
							<option value="proclamation">Proclamations</option>
							<option value="memo">Memos</option>
							<option value="speech">Speeches</option>
						</select>
						<select id="DocumentSortOrder">
							<option value="date-asc">Date (oldest first)</option>
							<option value="date-desc">Date (newest first)</option>
							<option value="title-asc">Title (A-Z)</option>
						</select>
					</div>
					<div id="DocumentList"></div>
					<div id="DocumentDetail">
						<button id="DocDetailBackBtn">&larr; Back to list</button>
						<h3 id="DocDetailTitle"></h3>
						<div id="DocDetailMeta"></div>
						<div id="DocDetailText"></div>
						<div id="DocDetailSource"></div>
						<span id="DocDetailTimelineLink">View on timeline</span>
					</div>
				</div>
			</div>
